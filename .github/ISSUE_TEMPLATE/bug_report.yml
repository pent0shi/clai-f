name: 🐛 Bug Report
description: Report a bug or unexpected behavior in clai
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: clai Version
      description: Run `clai --version` and paste the output here.
      placeholder: "3.9.7"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - WSL
        - Other
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Run `node -v` and paste the output here.
      placeholder: "v22.0.0"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - npm
        - Homebrew
        - curl install script
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the minimal steps needed to reproduce the behavior.
      placeholder: |
        1. Run `clai ...`
        2. Select '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or screenshots if applicable.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Error Output
      description: Paste any relevant log output. This will be automatically formatted as code.
      render: shell

  - type: dropdown
    id: provider
    attributes:
      label: AI Provider (if applicable)
      description: Which provider were you using when the bug occurred?
      options:
        - NVIDIA NIM
        - Groq
        - Google Gemini
        - OpenRouter
        - Bynara
        - Kimchi
        - Ollama (local)
        - Other
        - N/A

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, configuration details, or screenshots about the problem here.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this bug has not already been reported.
          required: true
        - label: I am running the latest version of clai.
          required: false
